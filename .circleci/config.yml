version: 2
jobs:
  build:
    docker:
      - image: cimg/ruby:3.2.2-node
    working_directory: ~/genova
    environment:
      AWS_ACCESS_KEY: ""
      AWS_ACCOUNT_ID: ""
      AWS_REGION: ""
      AWS_SECRET_KEY: ""
      GITHUB_ACCOUNT: metaps
      REDIS_DB: 0
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RAILS_ENV: test
      MONGO_DB: test_slackbot
      MONGO_DB_TEST: test_slackbot
      MONGO_HOST: localhost
      MONGO_PORT: 27017
      SECRET_KEY_BASE: dummy_secret_key_base_for_ci
    steps:
      - checkout
      - run:
          name: initialize
          command: |
            mkdir -p ~/.ssh
            touch ~/.ssh/id_rsa
            sudo apt-get update --allow-releaseinfo-change
      - restore_cache:
          key: bundle-{{ checksum "Gemfile.lock" }}
      - run:
          name: bundle install
          command: bundle install --path=vendor/bundle --jobs=4
      - save_cache:
          key: bundle-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - restore_cache:
          key: yarn-{{ checksum "yarn.lock" }}
      - run:
          name: yarn install
          command: yarn install --frozen-lockfile
      - save_cache:
          key: yarn-{{ checksum "yarn.lock" }}
          paths:
            - node_modules
      - run:
          name: install redis
          command: |
            sudo apt-get install redis-server
            sudo service redis-server start
      - run:
          name: install mongodb
          command: |
            wget -qO - https://www.mongodb.org/static/pgp/server-4.4.asc | sudo apt-key add -
            echo "deb http://repo.mongodb.org/apt/debian buster/mongodb-org/4.4 main" | sudo tee /etc/apt/sources.list.d/mongodb-org-4.4.list
            wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
            sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
            sudo apt-get update
            sudo apt-get install -y mongodb-org
            sudo chmod 777 /var/lib/mongodb
            sudo chmod 777 /var/log/mongodb
            mongod --dbpath /var/lib/mongodb --fork --logpath=/var/log/mongodb/mongod.log
      - run:
          name: rspec test
          command: |
            bundle exec rspec
